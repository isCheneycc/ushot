<svg xmlns="http://www.w3.org/2000/svg"
     width="1200" height="420" viewBox="0 0 1200 420"
     role="img" aria-labelledby="hero-title hero-desc">
  <title id="hero-title">Ushot — Capture. Annotate. Pin.</title>
  <desc id="hero-desc">A native, local-first screenshot utility for Apple silicon Macs, illustrated with a precise region selection, annotation stroke, and capture toolbar.</desc>

  <rect width="1200" height="420" rx="28" fill="#0E0F11"/>

  <g id="title-block"
     font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', sans-serif">
    <text x="64" y="92" fill="#F5F5F7" font-size="68" font-weight="730" letter-spacing="-2">Ushot</text>
    <text x="64" y="148" fill="#F5F5F7" font-size="34" font-weight="650" letter-spacing="-0.6">Capture. Annotate. Pin.</text>
    <text x="64" y="204" fill="#8E8E93" font-size="22" font-weight="450">A native, local-first screenshot utility</text>
    <text x="64" y="234" fill="#8E8E93" font-size="22" font-weight="450">for Apple silicon Macs.</text>

    <g id="metadata" font-size="20" font-weight="560" fill="#F5F5F7">
      <rect x="64" y="268" width="119" height="42" rx="21" fill="#2C2C2E"/>
      <text x="123.5" y="295" text-anchor="middle">macOS 14+</text>

      <rect x="193" y="268" width="156" height="42" rx="21" fill="#2C2C2E"/>
      <text x="271" y="295" text-anchor="middle">Apple Silicon</text>

      <rect x="359" y="268" width="145" height="42" rx="21" fill="#2C2C2E"/>
      <text x="431.5" y="295" text-anchor="middle">Apache-2.0</text>

      <rect x="514" y="268" width="150" height="42" rx="21" fill="#2C2C2E"/>
      <text x="589" y="295" text-anchor="middle">Direct Preview</text>
    </g>

    <g id="privacy-note" transform="translate(64 346)">
      <g id="local-device-icon" fill="none" stroke="#0A84FF" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
        <rect x="1.5" y="5" width="25" height="18" rx="4"/>
        <path d="M9 29H19M14 23V29"/>
        <path d="M7.5 14L11.5 18L20.5 9"/>
      </g>
      <text x="38" y="27" fill="#F5F5F7" font-size="22" font-weight="560">Capture Edit Send</text>
    </g>
  </g>

  <g id="capture-proof">
    <rect x="704" y="38" width="448" height="344" rx="26" fill="#2C2C2E" fill-opacity="0.38" stroke="#2C2C2E" stroke-width="2"/>

    <g id="window-chrome">
      <circle cx="734" cy="64" r="5" fill="#8E8E93" fill-opacity="0.85"/>
      <circle cx="752" cy="64" r="5" fill="#8E8E93" fill-opacity="0.55"/>
      <circle cx="770" cy="64" r="5" fill="#8E8E93" fill-opacity="0.35"/>
      <path d="M704 82H1152" stroke="#2C2C2E" stroke-width="2"/>
    </g>

    <g id="frozen-desktop">
      <rect x="730" y="96" width="396" height="184" rx="16" fill="#2C2C2E" fill-opacity="0.58"/>
      <rect x="748" y="112" width="172" height="148" rx="12" fill="#8E8E93" fill-opacity="0.12"/>
      <rect x="940" y="112" width="168" height="66" rx="12" fill="#8E8E93" fill-opacity="0.16"/>
      <rect x="940" y="190" width="168" height="70" rx="12" fill="#8E8E93" fill-opacity="0.10"/>
      <path d="M766 136H892M766 154H860M958 136H1088M958 214H1088" stroke="#8E8E93" stroke-width="5" stroke-linecap="round" stroke-opacity="0.28"/>
    </g>

    <g id="selection">
      <rect x="780" y="112" width="286" height="148" fill="none" stroke="#0A84FF" stroke-width="3"/>
      <rect x="775" y="107" width="10" height="10" rx="2" fill="#0E0F11" stroke="#0A84FF" stroke-width="2.5"/>
      <rect x="918" y="107" width="10" height="10" rx="2" fill="#0E0F11" stroke="#0A84FF" stroke-width="2.5"/>
      <rect x="1061" y="107" width="10" height="10" rx="2" fill="#0E0F11" stroke="#0A84FF" stroke-width="2.5"/>
      <rect x="775" y="181" width="10" height="10" rx="2" fill="#0E0F11" stroke="#0A84FF" stroke-width="2.5"/>
      <rect x="1061" y="181" width="10" height="10" rx="2" fill="#0E0F11" stroke="#0A84FF" stroke-width="2.5"/>
      <rect x="775" y="255" width="10" height="10" rx="2" fill="#0E0F11" stroke="#0A84FF" stroke-width="2.5"/>
      <rect x="918" y="255" width="10" height="10" rx="2" fill="#0E0F11" stroke="#0A84FF" stroke-width="2.5"/>
      <rect x="1061" y="255" width="10" height="10" rx="2" fill="#0E0F11" stroke="#0A84FF" stroke-width="2.5"/>
    </g>

    <g id="annotations" fill="none" stroke="#0A84FF" stroke-width="5" stroke-linecap="round" stroke-linejoin="round">
      <path d="M814 228C834 178 866 232 894 190C906 172 918 180 926 193"/>
      <path d="M916 224L1018 142"/>
      <path d="M994 145L1018 142L1011 165"/>
    </g>

    <g id="annotation-toolbar">
      <rect x="754" y="302" width="348" height="60" rx="18" fill="#2C2C2E" stroke="#8E8E93" stroke-opacity="0.24"/>

      <g id="cursor-tool" transform="translate(774 318)" fill="none" stroke="#F5F5F7" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
        <path d="M4 0L24 17L15 19L11 28Z"/>
      </g>

      <rect x="812" y="310" width="44" height="44" rx="12" fill="#0A84FF"/>
      <g id="pen-tool" transform="translate(819 318)" fill="none" stroke="#F5F5F7" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round">
        <path d="M4 24L7 16L20 3L26 9L13 22Z"/>
        <path d="M7 16L13 22"/>
      </g>

      <g id="arrow-tool" transform="translate(866 318)" fill="none" stroke="#F5F5F7" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
        <path d="M3 25L25 3"/>
        <path d="M14 3H25V14"/>
      </g>

      <rect x="914" y="321" width="24" height="22" rx="3" fill="none" stroke="#F5F5F7" stroke-width="2.4"/>
      <circle cx="972" cy="332" r="12" fill="none" stroke="#F5F5F7" stroke-width="2.4"/>

      <g id="text-tool" transform="translate(1006 318)" fill="none" stroke="#F5F5F7" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
        <path d="M1 26L12 2L23 26M5.5 17H18.5"/>
      </g>
      <path d="M1048 316V348" stroke="#8E8E93" stroke-width="1.5" stroke-opacity="0.65"/>

      <g id="pin-tool" transform="translate(1062 313)" fill="none" stroke="#F5F5F7" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
        <path d="M8 4H25L22 15L29 21H4L11 15Z"/>
        <path d="M16.5 21V34"/>
      </g>
    </g>
  </g>
</svg>
